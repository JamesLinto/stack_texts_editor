<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Data Structure - Text Editor Undo System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 700px; width: 100%; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h1 { color: #38bdf8; font-size: 24px; text-align: center; }
        .editor-box { background: #090d16; border: 2px solid #334155; border-radius: 8px; padding: 15px; font-size: 18px; min-height: 50px; margin-bottom: 15px; word-break: break-all; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background: #0284c7; color: white; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        button.undo-btn { background: #e11d48; }
        button.undo-btn:hover { background: #f43f5e; }
        .stack-container { margin-top: 20px; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; }
        .stack-list { display: flex; flex-direction: column-reverse; gap: 8px; min-height: 80px; max-height: 150px; overflow-y: auto; padding: 5px; }
        .stack-item { background: #334155; padding: 8px 12px; border-radius: 4px; font-family: monospace; border-left: 4px solid #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h1>Stack Assignment: Text Editor Undo System</h1>
    <p>Demonstrating LIFO (Last-In, First-Out) Stack operations.</p>

    <label>Current Document Text:</label>
    <div id="documentText" class="editor-box"></div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Type text to append..." />
        <button onclick="typeText()">Type / Push</button>
        <button class="undo-btn" onclick="undoText()">Undo / Pop</button>
    </div>

    <div class="stack-container">
        <h3>Undo Stack Memory (LIFO Visualizer)</h3>
        <div id="stackList" class="stack-list"><span style="color: #64748b;">Stack is empty (Initial State)</span></div>
    </div>
</div>

<script>
    let currentText = "";
    let undoStack = [];

    function updateDisplay() {
        document.getElementById("documentText").innerText = currentText || "[Empty Document]";
        
        let stackListDiv = document.getElementById("stackList");
        if (undoStack.length === 0) {
            stackListDiv.innerHTML = '<span style="color: #64748b;">Stack is empty (Initial State)</span>';
        } else {
            stackListDiv.innerHTML = "";
            undoStack.forEach((state, index) => {
                let item = document.createElement("div");
                item.className = "stack-item";
                item.innerText = `[Index ${index}] State: "${state}"`;
                stackListDiv.appendChild(item);
            });
        }
    }

    function typeText() {
        let input = document.getElementById("userInput");
        let val = input.value;
        if (!val) return;

        // Push current state to stack before changing (LIFO Push)
        undoStack.push(currentText);
        currentText += val;
        input.value = "";
        updateDisplay();
    }

    function undoText() {
        if (undoStack.length === 0) {
            alert("Undo Stack is empty! Nothing to undo.");
            return;
        }
        // Pop the most recent state from the stack (LIFO Pop)
        currentText = undoStack.pop();
        updateDisplay();
    }

    updateDisplay();
</script>

</body>
</html>
